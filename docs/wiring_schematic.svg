<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1060" viewBox="0 0 1580 1060" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrPow" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#E0533B"/>
    </marker>
    <marker id="arrUsb" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2E6FB7"/>
    </marker>
    <marker id="arrBus" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#6B4FB8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1580" height="1060" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="60" y="52" font-size="30" font-weight="700" fill="#1A1F2B">LeKiwi + Rubik Pi 3 — Power &amp; Data Wiring</text>
  <text x="60" y="82" font-size="17" fill="#5A6475">12V LeKiwi version · the wheels run off a dedicated 12V lithium battery; the Rubik Pi runs off a USB-C PD power bank; sensors draw 5V from the Pi's USB ports.</text>

  <!-- ================= CONNECTIONS (drawn first, under boxes) ================= -->

  <!-- Power bank -> Rubik Pi USB-C PD (12V) -->
  <polyline points="320,560 445,560 445,500 570,500" fill="none" stroke="#E0533B" stroke-width="3.5" marker-end="url(#arrPow)"/>
  <text x="330" y="548" font-size="14.5" fill="#B23A24" font-weight="600">USB-C PD · 12V/3A</text>

  <!-- 12V Lithium Battery -> Motor board 12V barrel -->
  <polyline points="320,225 445,225 445,195 570,195" fill="none" stroke="#E0533B" stroke-width="3.5" marker-end="url(#arrPow)"/>
  <text x="330" y="186" font-size="14.5" fill="#B23A24" font-weight="600">12V DC · barrel jack</text>

  <!-- Motor board -> Rubik Pi data (ttyACM0) -->
  <polyline points="700,280 700,430" fill="none" stroke="#2E6FB7" stroke-width="3.5" marker-end="url(#arrUsb)"/>
  <text x="712" y="360" font-size="14.5" fill="#1F558F" font-weight="600">USB-A · /dev/ttyACM0</text>

  <!-- Motor board -> Servo bus daisy chain -->
  <polyline points="900,205 1072,205 1072,150 1200,150" fill="none" stroke="#6B4FB8" stroke-width="3.5" marker-end="url(#arrBus)"/>
  <polyline points="1072,150 1072,320" fill="none" stroke="#6B4FB8" stroke-width="3.5"/>
  <polyline points="1072,235 1200,235" fill="none" stroke="#6B4FB8" stroke-width="3.5" marker-end="url(#arrBus)"/>
  <polyline points="1072,320 1200,320" fill="none" stroke="#6B4FB8" stroke-width="3.5" marker-end="url(#arrBus)"/>
  <text x="915" y="196" font-size="14.5" fill="#54399C" font-weight="600">Servo bus · 12V + TTL</text>

  <!-- Rubik Pi -> RPLiDAR (ttyUSB0) -->
  <polyline points="900,520 1200,520" fill="none" stroke="#2E6FB7" stroke-width="3.5" marker-end="url(#arrUsb)"/>
  <text x="950" y="508" font-size="14.5" fill="#1F558F" font-weight="600">USB-A · /dev/ttyUSB0</text>

  <!-- Rubik Pi -> D415 (USB3) -->
  <polyline points="900,590 1060,590 1060,685 1200,685" fill="none" stroke="#2E6FB7" stroke-width="3.5" marker-end="url(#arrUsb)"/>
  <text x="1075" y="640" font-size="14.5" fill="#1F558F" font-weight="600">USB 3.0 Type-A</text>

  <!-- ================= COMPONENT BOXES ================= -->

  <!-- 12V Lithium Battery (powers wheels) -->
  <rect x="80" y="150" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#E0533B" stroke-width="2.5"/>
  <text x="200" y="202" font-size="19" font-weight="700" fill="#1A1F2B" text-anchor="middle">12V Lithium Battery</text>
  <text x="200" y="230" font-size="15" fill="#5A6475" text-anchor="middle">4500 mAh</text>
  <text x="200" y="254" font-size="15" fill="#5A6475" text-anchor="middle">powers the wheels</text>

  <!-- Power Bank (powers Rubik Pi) -->
  <rect x="80" y="460" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#F2A33C" stroke-width="2.5"/>
  <text x="200" y="512" font-size="20" font-weight="700" fill="#1A1F2B" text-anchor="middle">USB-C PD Power Bank</text>
  <text x="200" y="542" font-size="15" fill="#5A6475" text-anchor="middle">12V / 3A output</text>
  <text x="200" y="566" font-size="15" fill="#5A6475" text-anchor="middle">powers the Rubik Pi</text>

  <!-- Motor Control Board -->
  <rect x="570" y="120" width="330" height="160" rx="14" fill="#FFFFFF" stroke="#6B4FB8" stroke-width="2.5"/>
  <text x="735" y="172" font-size="20" font-weight="700" fill="#1A1F2B" text-anchor="middle">Feetech Bus Servo Driver</text>
  <text x="735" y="202" font-size="15" fill="#5A6475" text-anchor="middle">STS3215 control board</text>
  <text x="735" y="226" font-size="15" fill="#5A6475" text-anchor="middle">12V power in · USB data to Pi</text>

  <!-- Rubik Pi 3 (hub) -->
  <rect x="570" y="430" width="330" height="230" rx="16" fill="#FFFFFF" stroke="#D83A2B" stroke-width="3"/>
  <text x="735" y="480" font-size="23" font-weight="700" fill="#D83A2B" text-anchor="middle">Rubik Pi 3</text>
  <text x="735" y="508" font-size="15.5" fill="#5A6475" text-anchor="middle">Qualcomm QCS6490 · 12 TOPS</text>
  <line x1="600" y1="528" x2="870" y2="528" stroke="#E2E6EC" stroke-width="1.5"/>
  <text x="735" y="556" font-size="14.5" fill="#1A1F2B" text-anchor="middle">USB-C PD (power in)</text>
  <text x="735" y="582" font-size="14.5" fill="#1A1F2B" text-anchor="middle">2× USB-A (serial)</text>
  <text x="735" y="608" font-size="14.5" fill="#1A1F2B" text-anchor="middle">1× USB 3.0 (camera)</text>
  <text x="735" y="636" font-size="13.5" fill="#5A6475" text-anchor="middle" font-style="italic">host: motor + both sensors</text>

  <!-- Servos -->
  <rect x="1200" y="118" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.2"/>
  <text x="1220" y="145" font-size="16.5" font-weight="700" fill="#1A1F2B">STS3215 · ID 7</text>
  <text x="1220" y="167" font-size="14" fill="#5A6475">Left wheel · 300°</text>

  <rect x="1200" y="203" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.2"/>
  <text x="1220" y="230" font-size="16.5" font-weight="700" fill="#1A1F2B">STS3215 · ID 8</text>
  <text x="1220" y="252" font-size="14" fill="#5A6475">Back wheel · 180°</text>

  <rect x="1200" y="288" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.2"/>
  <text x="1220" y="315" font-size="16.5" font-weight="700" fill="#1A1F2B">STS3215 · ID 9</text>
  <text x="1220" y="337" font-size="14" fill="#5A6475">Right wheel · 60°</text>

  <!-- RPLiDAR -->
  <rect x="1200" y="465" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#2B9E8E" stroke-width="2.5"/>
  <text x="1350" y="512" font-size="20" font-weight="700" fill="#1A1F2B" text-anchor="middle">RPLiDAR A2</text>
  <text x="1350" y="540" font-size="15" fill="#5A6475" text-anchor="middle">360° scan · USB serial</text>
  <text x="1350" y="562" font-size="14" fill="#5A6475" text-anchor="middle">5V + data over USB</text>

  <!-- D415 -->
  <rect x="1200" y="630" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#1F8FB0" stroke-width="2.5"/>
  <text x="1350" y="677" font-size="20" font-weight="700" fill="#1A1F2B" text-anchor="middle">Intel RealSense D415</text>
  <text x="1350" y="705" font-size="15" fill="#5A6475" text-anchor="middle">RGB + depth · USB 3.0</text>
  <text x="1350" y="727" font-size="14" fill="#5A6475" text-anchor="middle">5V + data over USB 3.0</text>

  <!-- ================= LEGEND ================= -->
  <rect x="80" y="860" width="900" height="150" rx="14" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1.5"/>
  <text x="104" y="898" font-size="17" font-weight="700" fill="#1A1F2B">Legend</text>

  <line x1="110" y1="930" x2="170" y2="930" stroke="#E0533B" stroke-width="4" marker-end="url(#arrPow)"/>
  <text x="185" y="935" font-size="15.5" fill="#1A1F2B">12V DC power</text>

  <line x1="110" y1="964" x2="170" y2="964" stroke="#2E6FB7" stroke-width="4" marker-end="url(#arrUsb)"/>
  <text x="185" y="969" font-size="15.5" fill="#1A1F2B">USB (5V + data)</text>

  <line x1="110" y1="998" x2="170" y2="998" stroke="#6B4FB8" stroke-width="4" marker-end="url(#arrBus)"/>
  <text x="185" y="1003" font-size="15.5" fill="#1A1F2B">Servo bus (12V + TTL, daisy-chained 7→8→9)</text>

  <text x="560" y="935" font-size="14.5" fill="#5A6475">• Rubik Pi 3 is the single USB host for the</text>
  <text x="572" y="957" font-size="14.5" fill="#5A6475">motor driver and both sensors.</text>
  <text x="560" y="985" font-size="14.5" fill="#5A6475">• Wheels run off the 12V battery via the driver;</text>
  <text x="572" y="1007" font-size="14.5" fill="#5A6475">the Pi runs off the USB-C power bank.</text>
</svg>
